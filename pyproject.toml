[project]
name = "claude-code"
version = "0.1.0"
description = "Claude Code workspace"
readme = "README.md"
authors = [
    { name = "Zr", email = "547471919@qq.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
claude-code = "claude_code:main"

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "pytest>=8.0.0",
    "mypy>=1.17.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["claude_code"]
