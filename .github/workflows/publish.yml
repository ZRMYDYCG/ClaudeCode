name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Verify tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME}"
          expected="${tag#v}"
          actual="$(
            python3 - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )"
          echo "tag=${tag} expected=${expected} pyproject=${actual}"
          if [[ "$expected" != "$actual" ]]; then
            echo "::error::Tag version (${expected}) != pyproject.toml version (${actual})"
            exit 1
          fi
          if ! grep -qE "^## \[${actual}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing section ## [${actual}]"
            exit 1
          fi

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy core

      - name: Tests
        run: uv run pytest
        env:
          API_KEY: test-api-key
          BASE_URL: https://example.com/v1
          MODEL_NAME: test-model

      - name: Build
        run: uv build

      - name: Publish to PyPI
        env:
          # 若已配置 Trusted Publishing，可不设 secret；否则在仓库 Secrets 加 UV_PUBLISH_TOKEN
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: |
          version="$(
            python3 - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )"
          if curl -sf "https://pypi.org/pypi/zrcoder/${version}/json" >/dev/null; then
            echo "zrcoder==${version} 已在 PyPI，跳过上传。"
            exit 0
          fi
          uv publish \
            --trusted-publishing automatic \
            --check-url https://pypi.org/simple/zrcoder/
